<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="0.5" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#C74634"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9FD8FF"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#shine); animation: fade 1.2s ease-out both; }
    .role { font: 600 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E6EDF3; letter-spacing: 2px; animation: fade 1.2s ease-out 0.4s both; }
    .tags { font: 500 16px 'Consolas', 'Courier New', monospace; fill: #9FD8FF; animation: fade 1.2s ease-out 0.8s both; }
    .w1 { animation: drift 9s ease-in-out infinite alternate; }
    .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    .dot { animation: blink 2.4s ease-in-out infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle class="dot" cx="90" cy="50" r="2.5"/>
    <circle class="dot" cx="1110" cy="70" r="2" style="animation-delay:0.8s"/>
    <circle class="dot" cx="210" cy="180" r="1.8" style="animation-delay:1.4s"/>
    <circle class="dot" cx="1000" cy="170" r="2.2" style="animation-delay:0.4s"/>
    <circle class="dot" cx="620" cy="30" r="1.6" style="animation-delay:1.9s"/>
  </g>
  <text x="600" y="105" text-anchor="middle" class="name">Diego Tejada</text>
  <text x="600" y="148" text-anchor="middle" class="role">SOLUTION ARCHITECT · DEVELOPMENT LEADER</text>
  <text x="600" y="180" text-anchor="middle" class="tags">.NET Core  ·  Azure  ·  Oracle Cloud  ·  Microservicios  ·  B2B / EDI</text>
  <path class="w1" fill="#0D1117" fill-opacity="0.35" d="M0 225 C 150 195 300 255 450 225 S 750 195 900 225 S 1200 255 1350 225 L 1350 260 L 0 260 Z"/>
  <path class="w2" fill="#0D1117" fill-opacity="0.6" d="M-60 240 C 90 220 240 262 390 240 S 690 218 840 240 S 1140 262 1290 240 L 1290 260 L -60 260 Z"/>
</svg>
