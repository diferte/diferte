name: Estadísticas del perfil

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días (1:00 a. m. hora Colombia)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar tarjetas de estadísticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/profile-stats.mjs

      - name: Generar la serpiente de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || git commit -m "Actualizar estadísticas del perfil"
          git push
